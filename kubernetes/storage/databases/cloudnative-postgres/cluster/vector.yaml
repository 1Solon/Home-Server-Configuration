---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgvector17
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: miroir-replicated
  bootstrap:
    recovery:
      backup:
        name: pgvector17-20260603000000
      database: postgres
      # Note: This is the path I used to port from crunchy-postgres to cloudnative-pg.
      # import:
      #   type: monolith
      #   databases:
      #     - immich_db
      #   roles:
      #     - _crunchypgbouncer
      #     - immich
      #   source:
      #     externalCluster: crunchy-vector-source
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - pgaudit
      - vchord.so
    parameters:
      max_connections: "400"
      max_locks_per_transaction: "128"
      shared_buffers: 256MB
      timescaledb.telemetry_level: "off"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 5Gi
  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pgvector17
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: pgvector17-v3

  # Note: This is the path I used to port from crunchy-postgres to cloudnative-pg.
  # externalClusters:
  #   - name: crunchy-vector-source
  #     connectionParameters:
  #       host: postgres-vector-primary
  #       user: postgres
  #       dbname: postgres
  #       sslmode: prefer
  #     password:
  #       name: postgres-vector-pguser-postgres
  #       key: password
