---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    # Kubernetes won't let a StorageClass's parameters change in place, so
    # Flux deletes and recreates it on any change. Existing volumes are not
    # touched; only new ones pick up the new settings.
    kustomize.toolkit.fluxcd.io/force: enabled
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  # Three full copies, and writes pause if fewer than two can see each other.
  # One node can be down without interrupting anything, and split-brain
  # can't happen. See AGENTS.md "Replicas and quorum".
  miroir.home-operations.com/replicas: "3"
  miroir.home-operations.com/pool: data
  miroir.home-operations.com/quorum: freeze
  miroir.home-operations.com/allowRemoteVolumeAccess: "true"
  csi.storage.k8s.io/fstype: ext4
---
# Disposable client and staging data only. Application data must use a
# replicated class selecting the `data` pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-ephemeral
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "1"
  miroir.home-operations.com/pool: client
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: miroir-snap
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: miroir.home-operations.com
deletionPolicy: Delete
---
# Group snapshots capture every PVC of an app crash-consistently in one
# operation. Requires the groupSnapshots feature enabled on the Miroir
# HelmRelease.
apiVersion: groupsnapshot.storage.k8s.io/v1beta1
kind: VolumeGroupSnapshotClass
metadata:
  name: miroir-groupsnap
driver: miroir.home-operations.com
deletionPolicy: Delete
