---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # VectorChord image so Immich gets vchord; it also covers everything the old
  # postgres17 apps need (pg_trgm, unaccent, pgaudit).
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: miroir-replicated
  # Physical copy of pgvector17 (Immich, BookOrbit) so vchord indexes come
  # across intact. The postgres17 databases are added afterwards with
  # pg_dump/pg_restore.
  bootstrap:
    recovery:
      source: pgvector17
      database: postgres
      # The owner defaults to `postgres`, so without this every new primary
      # overwrites the superuser password with the generated postgres-app one
      # and the apps' postgres-init containers fail to log in.
      secret:
        name: cloudnative-pg-secret
  externalClusters:
    - name: pgvector17
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pgvector17
          serverName: pgvector17-v3
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  # For apps that can't run the postgres-init container (operator-managed
  # pods); each has a Database in databases/.
  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-postgres-role
  postgresql:
    shared_preload_libraries:
      - pgaudit
      - vchord.so
    parameters:
      max_connections: "400"
      max_locks_per_transaction: "128"
      shared_buffers: 512MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 5Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres
        # Bump the suffix whenever this cluster is rebuilt from its own backups.
        serverName: postgres-v1
