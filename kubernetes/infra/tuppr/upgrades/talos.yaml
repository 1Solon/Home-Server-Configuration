---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
    name: talos
spec:
    talos:
        # renovate: datasource=custom.talos-factory depName=siderolabs/talos
        version: v1.14.1
    policy:
        timeout: 30m
        debug: true
        placement: hard
        # Waits for CSI VolumeAttachments, not Miroir (attachRequired: false).
        # Miroir readiness is checked below.
        waitForVolumeDetach: true
    drain:
        enabled: true
    healthChecks:
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: Snapshot
          expr: |-
              status.phase != 'Running'
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: Restore
          expr: |-
              !(status.phase in ['Resolving', 'Restoring'])
        - apiVersion: miroir.home-operations.com/v1alpha1
          kind: MiroirVolume
          expr: |-
              status.phase == 'Ready'
