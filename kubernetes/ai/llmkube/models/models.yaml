---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
spec:
  # The main GGUF already carries the MTP head (blk.64.nextn.*), so draft-mtp needs no companion file.
  source: hf://unsloth/Qwen3.8-27B-GGUF@4ca720788d1e01f1bff70c033e0d0028fd02e502
  files:
    - Qwen3.8-27B-UD-IQ4_XS.gguf
  fileSha256:
    Qwen3.8-27B-UD-IQ4_XS.gguf: 40fac4050e940397dbf13087afd50f4734a11805bf9d65ef8ddd7483470e6199
  format: gguf
  quantization: UD-IQ4_XS
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
spec:
  modelRef: qwen3-8-27b
  speculativeDecoding:
    type: draft-mtp
    # n3 measured ~11% faster than n2 on a 4060 Ti 16GB; n4 fails to load (sudoingX/qwen38-mtp).
    nDraftMax: 3
  modelCache:
    persistence: Cached
  runtime: llamacpp
  mode: chat
  # Scaled down 2026-10-30: its users moved to DeepSeek V4.1 Flash on the DGX Sparks. Set to 1 to bring it back.
  replicas: 0
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:26b2aa0724c95accb3711560ee854da0985c676f16745b81bd966fdc6606a75a
  # Dense model: every layer must stay in VRAM or prompt processing (TTFT) collapses.
  # 64K at q4_0 runs out of VRAM by ~420MiB with two slots and the MTP head, even with
  # the GPU otherwise empty; 32K is the largest power of two that fits.
  contextSize: 32768
  parallelSlots: 2
  flashAttention: true
  jinja: true
  batchSize: 2048
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kube5
  resources:
    cpu: "4"
    # Weights run from VRAM; host memory holds the mmap'd GGUF, the 10Gi prompt cache
    # and recurrent-state checkpoints (~150Mi each) used for prompt-cache reuse.
    hostMemory: 16Gi
    memoryLimit: 34Gi
    gpu: 1
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
  extraArgs:
    - --kv-unified
    - --cache-ram
    - "10240"
    - --reasoning-preserve
    # The template defaults to xhigh, which can think for thousands of tokens on trivial prompts.
    - --reasoning-effort
    - medium
    - --alias
    - qwen3.8-27b
    - --verbosity
    - "3"
    # --fit spills layers to the CPU rather than fail, which halves decode; keep llmkube's
    # injected --n-gpu-layers 99 so a VRAM shortfall fails loudly at startup instead.
    - --fit
    - "off"
    - --spec-draft-type-k
    - q4_0
    - --spec-draft-type-v
    - q4_0
    # Sample the MTP draft and verify by rejection instead of greedy argmax; same output
    # distribution, ~7% faster decode at temp 1.0 (55% -> 62% acceptance), no-op at temp 0.
    - --spec-draft-sampling
    - probabilistic
    # Qwen thinking-mode sampling defaults from the model card; clients may override.
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0.0"
    # Only sampling and embedding lookups run on the CPU now.
    - --threads
    - "4"
    - --timeout
    - "7200"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
      startup:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 360
      liveness:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 6
      readiness:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
        failureThreshold: 6
