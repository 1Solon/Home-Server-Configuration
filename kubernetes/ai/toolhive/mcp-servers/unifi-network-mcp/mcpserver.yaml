---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-network-mcp
spec:
  # renovate: depName=ghcr.io/sirkirby/unifi-network-mcp
  image: ghcr.io/sirkirby/unifi-network-mcp:0.32.10@sha256:41a8dc6f40dae7eeb5b8292c8e422878e04a7a30874757e079f435affc5b962e
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: UNIFI_NETWORK_HOST
      # The client adds the URL scheme; this must be a bare hostname.
      value: unifi.${LOCAL_DOMAIN}
    - name: UNIFI_NETWORK_VERIFY_SSL
      value: "false"
    - name: UNIFI_NETWORK_SITE
      value: default
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: meta_only
    - name: UNIFI_POLICY_CREATE
      value: "false"
    - name: UNIFI_POLICY_UPDATE
      value: "false"
    - name: UNIFI_POLICY_DELETE
      value: "false"
    - name: UNIFI_TOOL_PERMISSION_MODE
      value: confirm
  secrets:
    - name: toolhive-unifi-network-username
      key: UNIFI_NETWORK_USERNAME
      targetEnvName: UNIFI_NETWORK_USERNAME
    - name: toolhive-unifi-network-password
      key: UNIFI_NETWORK_PASSWORD
      targetEnvName: UNIFI_NETWORK_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
