---
# Kopiur 0.10.3 reads the base Restore object to reuse its pinned snapshot on retries.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kopiur-mover-restore-reader
rules:
  - apiGroups:
      - kopiur.home-operations.com
    resources:
      - restores
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopiur-mover-restore-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kopiur-mover-restore-reader
subjects:
  - kind: ServiceAccount
    name: kopiur-mover
