---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: ornith-1-0-35b
spec:
  source: pvc://llmkube-models/models--deepreinforce-ai--Ornith-1.0-35B-GGUF/snapshots/383064f72a1ef3087b779f268d3ca117eb989aac/ornith-1.0-35b-Q5_K_M.gguf
  format: gguf
  quantization: Q5_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: -1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: ornith-1-0-35b
spec:
  modelRef: ornith-1-0-35b
  runtime: llamacpp
  mode: chat
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:f5c8cfd4f1d019021eae00d03a9eb209eb3d1a65cf4879dd332205cdb3bc9071
  bindAddress: 0.0.0.0
  contextSize: 262144
  parallelSlots: 2
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  moeCPULayers: 21
  reasoningBudget: 3000
  reasoningBudgetMessage: "\n\nSYSTEM ERROR!: You have exceeded the reasoning budget. Thinking has been terminiated. You must answer now. "
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kube5
  resources:
    cpu: 500m
    memory: 4Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
