---
group_sessions_per_user: true
model:
  provider: opencode-go
  default: claude-haiku-5-5
auxiliary:
  vision:
    provider: opencode-go
    model: claude-haiku-5-5
  curator:
    provider: opencode-go
    model: claude-haiku-5-5
web:
  search_backend: searxng
  extract_backend: firecrawl
browser:
  cdp_url: ws://browserless.ai.svc.cluster.local:3000
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  provider: mnemosyne
  memory_char_limit: 4000
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  # Anthropic suggests high for Haiku 5.5 on longer agent tasks. Hermes
  # doesn't pass this setting on to Haiku models yet (as of v2026.9.24), so
  # until it does, Haiku runs at its own default of medium.
  reasoning_effort: high
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 46
