---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dossier
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dossier-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        DATABASE_URL: postgresql://dossier:{{ .DOSSIER_POSTGRES_PASSWORD }}@postgres17-rw.databases.svc.cluster.local:5432/dossier
        DOSSIER_PASSWORD: "{{ .DOSSIER_PASSWORD }}"
        DOSSIER_SECRET: "{{ .DOSSIER_SECRET }}"
  dataFrom:
    - extract:
        key: dossier
---
# Kept apart so the app, which fetches and renders third-party pages, never holds the superuser password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dossier-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dossier-db-init-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        INIT_POSTGRES_DBNAME: dossier
        INIT_POSTGRES_HOST: postgres17-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: dossier
        INIT_POSTGRES_PASS: "{{ .DOSSIER_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: dossier
