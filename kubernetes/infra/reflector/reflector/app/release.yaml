apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: default
spec:
  interval: 30m
  releaseName: reflector
  chart:
    spec:
      chart: reflector
      version: 10.0.68
      sourceRef:
        kind: HelmRepository
        name: reflector
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
