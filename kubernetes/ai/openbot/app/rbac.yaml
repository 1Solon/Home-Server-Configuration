---
# Reuses the read-only role from the Hermes app (no Secrets, no exec).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbot-read-all
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-read-all
subjects:
  - kind: ServiceAccount
    name: openbot
    namespace: ai
