---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bifrost-db-secret
    template:
      engineVersion: v2
      data:
        BF_DB_DIALECT: postgres
        BF_DB_HOST: postgres-rw.databases.svc.cluster.local
        BF_DB_PORT: "5432"
        BF_DB_NAME: bifrost
        BF_DB_USER: bifrost
        BF_DB_PASS: "{{ .BIFROST_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: bifrost
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: bifrost
        INIT_POSTGRES_PASS: "{{ .BIFROST_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: bifrost
