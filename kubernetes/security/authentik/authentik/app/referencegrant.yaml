---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
# Lets SecurityPolicies from components/ext-auth reach the embedded outpost.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: ext-auth-outpost
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ai
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: bifrost
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: books
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: garage
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-dashboard
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: syncthing
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: zerobyte
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
