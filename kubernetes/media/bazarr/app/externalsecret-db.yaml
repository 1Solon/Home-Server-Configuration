---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bazarr-db-secret
    template:
      engineVersion: v2
      data:
        POSTGRES_ENABLED: "true"
        POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_DATABASE: bazarr
        POSTGRES_USERNAME: bazarr
        POSTGRES_PASSWORD: "{{ .BAZARR_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: bazarr
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: bazarr
        INIT_POSTGRES_PASS: "{{ .BAZARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: bazarr
