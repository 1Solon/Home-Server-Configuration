---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 600
      # Tools installed onto the PVC are architecture-specific.
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      hermes:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: *app
        initContainers:
          install-tools:
            dependsOn: init-config
            image:
              repository: nousresearch/hermes-agent
              tag: v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                P=/opt/data/.local
                # Pin as a pair: mnemosyne-hermes declares a floor on
                # mnemosyne-memory, not an exact pin, so a free uv pick can
                # land a broken combination (0.7.0-0.7.2 + 3.x failed every
                # memory tool call with an ImportError). 0.7.7 requires
                # mnemosyne-memory>=4.0.0.
                # renovate: datasource=pypi depName=mnemosyne-hermes
                MNEMOSYNE_HERMES=0.7.7
                # renovate: datasource=pypi depName=mnemosyne-memory
                MNEMOSYNE_MEMORY=4.0.0
                MNEMOSYNE_VENV="$P/mnemosyne"
                # The image keeps uv off PATH (as of v0.23.0), in a directory
                # named for its version and architecture.
                UV=$(echo /opt/hermes/tools/uv-*/uv)
                # Rebuild the venv when the image's Python changes (3.13 to
                # 3.14 by v0.23.0); packages built for the old one won't import.
                PY_VERSION='import sys; print(sys.version_info[:2])'
                if [ "$("$MNEMOSYNE_VENV/bin/python" -c "$PY_VERSION" 2>/dev/null)" != "$(/opt/hermes/.venv/bin/python -c "$PY_VERSION")" ]; then
                  rm -rf "$MNEMOSYNE_VENV"
                  "$UV" venv --python /opt/hermes/.venv/bin/python "$MNEMOSYNE_VENV"
                fi
                if ! "$MNEMOSYNE_VENV/bin/python" -c "import importlib.metadata as m; assert m.version('mnemosyne-hermes') == '$MNEMOSYNE_HERMES'; assert m.version('mnemosyne-memory') == '$MNEMOSYNE_MEMORY'" 2>/dev/null; then
                  # The hermes-agent image quarantines PyPI uploads for 3
                  # days (exclude-newer in its bundled pyproject.toml), so
                  # fresh mnemosyne releases can't resolve straight away.
                  # Deliberately bypassed here: both packages are exact-pinned
                  # above, so the quarantine buys nothing for this install.
                  UV_EXCLUDE_NEWER="0 days" "$UV" pip install --python "$MNEMOSYNE_VENV/bin/python" --upgrade \
                    "mnemosyne-hermes==$MNEMOSYNE_HERMES" \
                    "mnemosyne-memory[embeddings]==$MNEMOSYNE_MEMORY"
                fi

                rm -rf /opt/data/plugins/mnemosyne
                HERMES_HOME=/opt/data "$MNEMOSYNE_VENV/bin/mnemosyne-hermes" install \
                  --mode wrapper \
                  --python "$MNEMOSYNE_VENV/bin/python"
                HERMES_HOME=/opt/data "$MNEMOSYNE_VENV/bin/mnemosyne-hermes" status
                mkdir -p /opt/data/mnemosyne
                chown -R 10000:10000 /opt/data/mnemosyne
                # uv sits in a versioned directory off PATH; relink each start so the agent can `uv tool install`.
                ln -sfn "$UV" /opt/data/.local/bin/uv
                ln -sfn "$(dirname "$UV")/uvx" /opt/data/.local/bin/uvx
          init-config:
            image:
              repository: nousresearch/hermes-agent
              tag: &hermesTag v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
            command:
              - /bin/bash
              - -c
              - |
                set -eu
                cp /desired/{config.yaml,SOUL.md} /staging/
                touch /staging/.env /opt/data/.env
                sed -i '/^[[:space:]]*API_SERVER_KEY[[:space:]]*=/d' /opt/data/.env
                HERMES_HOME=/staging HOME=/staging /opt/hermes/.venv/bin/python -c 'from hermes_cli.config import migrate_config; migrate_config(interactive=False,quiet=False)'
                # Made here so the bridge's subPath mounts aren't created root-owned by the kubelet.
                mkdir -p /opt/data/obsidian /opt/data/.livesync-bridge/location_data
                chown 10000:10000 /opt/data/obsidian /opt/data/.livesync-bridge /opt/data/.livesync-bridge/location_data
                mkdir -p /opt/data/workspace
                chown 0:0 /opt/data/workspace
                chmod 750 /opt/data/workspace
                chown 10000:10000 /opt/data/workspace
                for f in config.yaml SOUL.md; do
                  rm -f "/opt/data/.$f.new"
                  install -m 600 "/staging/$f" "/opt/data/.$f.new"
                  chown 10000:10000 "/opt/data/.$f.new"
                  mv -f "/opt/data/.$f.new" "/opt/data/$f"
                done
                chown 0:0 /opt/data/.env 2>/dev/null || touch /opt/data/.env
                chmod 600 /opt/data/.env
                chown 10000:10000 /opt/data/.env
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: *hermesTag
            args: ["gateway", "run"]
            env:
              TZ: "${TZ}"
              HERMES_HOME: /opt/data
              PATH: &path /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/mnemosyne/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # The terminal's login shell resets PATH from /etc/profile;
              # resources/profile.sh restores it from CONTAINER_PATH.
              CONTAINER_PATH: *path
              TERM: xterm-256color
              # Keep download caches off the data volume. They can be
              # refetched, so there's no point copying them three times and
              # backing them up. uv can't hardlink across volumes, so it copies.
              npm_config_cache: /opt/cache/npm
              UV_CACHE_DIR: /opt/cache/uv
              UV_LINK_MODE: copy
              # Agent-installed tools persist on the data volume: `npm -g` and `uv tool` both land in
              # /opt/data/.local/bin. Managed Python keeps uv tools working when the image's Python changes.
              npm_config_prefix: /opt/data/.local
              UV_PYTHON_PREFERENCE: only-managed
              MNEMOSYNE_HOME: /opt/data/mnemosyne
              # Summarise and extract facts through Hermes' auxiliary model.
              MNEMOSYNE_HOST_LLM_ENABLED: "true"
              MNEMOSYNE_HOST_LLM_TIMEOUT: "60"
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              API_SERVER_PORT: &apiPort 8642
              API_SERVER_CORS_ORIGINS: "https://hermes.${LOCAL_DOMAIN}"
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_OIDC_ISSUER: https://sso.${REMOTE_DOMAIN}/application/o/hermes/
              # Authentik only issues a refresh token for offline_access; without one the session ends with the
              # 5-minute access token.
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email offline_access
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.${LOCAL_DOMAIN}
              FIRECRAWL_API_URL: http://firecrawl-api.ai.svc.cluster.local:3002
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              QWEN_IMAGE_API_KEY: none
              OBSIDIAN_VAULT_PATH: /opt/data/obsidian
            envFrom:
              - secretRef:
                  name: *app
            ports:
              - name: api
                containerPort: *apiPort
                protocol: TCP
              - name: dashboard
                containerPort: *dashboardPort
                protocol: TCP
              - name: webapp
                containerPort: &webappPort 9120
                protocol: TCP
              - name: webhook
                containerPort: &webhookPort 8644
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "curl --fail-early -fsS http://127.0.0.1:8642/health http://127.0.0.1:9119/ >/dev/null"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "curl --fail-early -fsS http://127.0.0.1:8642/health http://127.0.0.1:9119/ >/dev/null"]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
          # Keeps a decrypted copy of the Obsidian vault (Self-hosted LiveSync on CouchDB) at /opt/data/obsidian,
          # in both directions. Upstream publishes no image, so this fetches the pinned source and installs its
          # locked dependencies on start, which is all upstream's Dockerfile does.
          obsidian-bridge:
            image:
              repository: denoland/deno
              tag: 2.9.8@sha256:a0d88a7fcbd44f062cba2748e19df67d30290ad12aa203c7c1e0b12462c483f0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                # https://github.com/vrtmrz/livesync-bridge has no releases; bump this commit by hand.
                SHA=1c252305bbddcacd200b8560d3bb786afe0906e9
                rm -rf /opt/bridge/app && mkdir -p /opt/bridge/app /opt/bridge/deno /opt/bridge/home /opt/bridge/tmp
                # Deno localStorage, where the bridge records what it has synced. Kept on the data volume, because
                # losing it means a full rescan; linked rather than mounted so DENO_DIR stays writable.
                ln -sfn /state/location_data /opt/bridge/deno/location_data
                cd /opt/bridge/app
                deno eval "const r = await fetch('https://codeload.github.com/vrtmrz/livesync-bridge/tar.gz/$SHA'); if (!r.ok) throw new Error(r.statusText); await Deno.writeFile('/opt/bridge/src.tar.gz', new Uint8Array(await r.arrayBuffer()));"
                tar -xzf /opt/bridge/src.tar.gz --strip-components=1 && rm /opt/bridge/src.tar.gz
                deno install --frozen
                exec deno task run
            env:
              HOME: /opt/bridge/home
              TMPDIR: /opt/bridge/tmp
              NO_COLOR: "1"
              DENO_DIR: /opt/bridge/deno
              LSB_CONFIG: /config/config.json
              LSB_HEALTH_FILE: /opt/bridge/health.json
            probes:
              # The bridge rewrites this file every 10s; a stale one means a wedged event loop.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, 'test -n "$(find /opt/bridge/health.json -mmin -2)" && ! grep -q "\"restartWorthy\":true" /opt/bridge/health.json']
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, 'test -n "$(find /opt/bridge/health.json -mmin -2)"']
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 20m
                memory: 192Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ports:
          api:
            port: *apiPort
      dashboard:
        controller: *app
        ports:
          http:
            port: 9119
      webapp:
        controller: *app
        ports:
          http:
            port: *webappPort
      webhook:
        controller: *app
        ports:
          http:
            port: *webhookPort

    route:
      app:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes
          gethomepage.dev/description: Personal AI agent dashboard
          gethomepage.dev/group: AI
          gethomepage.dev/icon: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/hermesagent.svg
          gethomepage.dev/pod-selector: app.kubernetes.io/name=hermes
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - "hermes.${LOCAL_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http
      webapp:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes App
          gethomepage.dev/description: Hermes Desktop workspace in the browser
          gethomepage.dev/group: AI
          gethomepage.dev/icon: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/hermesagent.svg
          gethomepage.dev/pod-selector: app.kubernetes.io/name=hermes
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - "hermes-app.${LOCAL_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: webapp
                port: http
      # Public so GitHub can deliver events; every route checks the sender's HMAC signature.
      webhook:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/target: ipv4.${REMOTE_DOMAIN}
          gatus.home-operations.com/enabled: "false"
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        hostnames:
          - "hermes-webhook.${REMOTE_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /webhooks/
            backendRefs:
              - identifier: webhook
                port: http

    persistence:
      config:
        existingClaim: hermes-kopiur-replacement
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            init-config:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            obsidian-bridge:
              - path: /vault
                subPath: obsidian
              - path: /state
                subPath: .livesync-bridge

      config-file:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /opt/terminal/profile.sh
                subPath: profile.sh
                readOnly: true
            init-config:
              - path: /desired/config.yaml
                subPath: config.yaml
                readOnly: true
              - path: /desired/SOUL.md
                subPath: SOUL.md
                readOnly: true

      # The GitHub App Milton acts as on GitHub. Milton keeps its own sign-in tooling on the data volume.
      github-app:
        type: secret
        name: hermes-github-app
        defaultMode: 0440
        advancedMounts:
          hermes:
            app:
              - path: /opt/secrets/github-app
                readOnly: true

      obsidian-bridge-config:
        type: secret
        name: hermes-obsidian-bridge
        defaultMode: 0440
        advancedMounts:
          hermes:
            obsidian-bridge:
              - path: /config
                readOnly: true

      # Deno's cache and the bridge source; refetched on every start.
      obsidian-bridge:
        type: emptyDir
        advancedMounts:
          hermes:
            obsidian-bridge:
              - path: /opt/bridge

      config-staging:
        type: emptyDir
        advancedMounts:
          hermes:
            init-config:
              - path: /staging

      cache:
        type: emptyDir
        sizeLimit: 8Gi
        advancedMounts:
          hermes:
            app:
              - path: /opt/cache

      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          hermes:
            app:
              - path: /dev/shm

      tmpfs:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
            init-config:
              - path: /tmp
                subPath: init-config
            install-tools:
              - path: /tmp
                subPath: install-tools

    serviceAccount:
      hermes: {}
