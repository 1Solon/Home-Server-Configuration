---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mem0-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        ADMIN_API_KEY: "{{ .MEM0_ADMIN_API_KEY }}"
        JWT_SECRET: "{{ .MEM0_JWT_SECRET }}"
        # The LLM is GLM on the DGX Sparks; the embedding service ignores the key.
        OPENAI_API_KEY: "{{ .DGX_SPARK_API_KEY }}"
        POSTGRES_PASSWORD: "{{ .MEM0_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: mem0 mem0_app
        INIT_POSTGRES_HOST: pgvector17-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: mem0
        INIT_POSTGRES_PASS: "{{ .MEM0_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: mem0
    - extract:
        key: ai-api-keys
    - extract:
        key: cloudnative-pg
