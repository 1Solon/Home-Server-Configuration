---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-opus-5-5
spec:
  modelName: claude-opus-5-5
  params:
    model: anthropic/claude-opus-5-5
    apiKeyRef:
      name: litellm-secret
      key: ANTHROPIC_API_KEY
    # Most OpenAI-format clients send no cache_control, so Anthropic would bill
    # every prompt in full. Mark the system prompt and the latest message.
    additional:
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
