---
group_sessions_per_user: true
model:
  provider: dgx-spark
  default: GLM-5.3-Flash-EXL3
# GLM-5.3 Flash on the two DGX Sparks (head 192.168.1.106, outside the cluster). OpenCode Go stays
# available through OPENCODE_GO_API_KEY for /model.
providers:
  dgx-spark:
    name: DGX Sparks
    base_url: http://192.168.1.106:8888/v1
    key_env: DGX_SPARK_API_KEY
    default_model: GLM-5.3-Flash-EXL3
    context_length: 1048576
auxiliary:
  vision:
    provider: dgx-spark
    model: GLM-5.3-Flash-EXL3
  curator:
    provider: dgx-spark
    model: GLM-5.3-Flash-EXL3
image_gen:
  provider: openai
  openai:
    base_url: http://qwen-image.ai.svc.cluster.local:8080/v1
    # sd-server has no auth, but the provider won't run without a key.
    key_env: QWEN_IMAGE_API_KEY
    model: qwen-image-2.1-turbo
web:
  search_backend: searxng
  extract_backend: firecrawl
browser:
  cdp_url: ws://browserless.ai.svc.cluster.local:3000
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  # Settings in mem0.json. No user_id there on purpose: each Discord user gets their own memory
  # (Saul's is shared with OpenCode); api_server, CLI and cron fall back to "hermes-user".
  provider: mem0
  memory_char_limit: 4000
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  # GLM's template thinks at max when no effort is sent; the server accepts only low, high and max.
  reasoning_effort: high
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 46
