---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
# Lets SecurityPolicies from components/ext-auth reach the embedded outpost.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: ext-auth-outpost
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
