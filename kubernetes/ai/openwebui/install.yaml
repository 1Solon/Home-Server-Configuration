---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openwebui
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: kopiur-repository-ai
      namespace: flux-system
  path: "./kubernetes/ai/openwebui/app"
  targetNamespace: ai
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      APP: open-webui-config
      KOPIUR_SOURCE_PVC: open-webui-config-kopiur-replacement
      KOPIUR_SCHEDULE: "15 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
