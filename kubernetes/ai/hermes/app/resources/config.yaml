---
group_sessions_per_user: true
model:
  provider: dgx-spark
  default: DeepSeek-V4.1-Flash-1017
# DeepSeek V4.1 Flash on the two DGX Sparks (head 192.168.1.106, outside the cluster). OpenCode Go stays
# available through OPENCODE_GO_API_KEY for /model.
providers:
  dgx-spark:
    name: DGX Sparks
    base_url: http://192.168.1.106:8888/v1
    key_env: DGX_SPARK_API_KEY
    default_model: DeepSeek-V4.1-Flash-1017
    context_length: 524288
auxiliary:
  vision:
    provider: dgx-spark
    model: DeepSeek-V4.1-Flash-1017
  curator:
    provider: dgx-spark
    model: DeepSeek-V4.1-Flash-1017
web:
  search_backend: searxng
  extract_backend: firecrawl
browser:
  cdp_url: ws://browserless.ai.svc.cluster.local:3000
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  provider: mnemosyne
  memory_char_limit: 4000
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  reasoning_effort: max
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 46
