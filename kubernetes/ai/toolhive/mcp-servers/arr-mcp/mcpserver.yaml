---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr
spec:
  image: docker.io/node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SONARR_URL
      value: http://sonarr.home-media:8080
    - name: RADARR_URL
      value: http://radarr.home-media:8080
    - name: PROWLARR_URL
      value: http://prowlarr.home-media:8080
  secrets:
    - name: toolhive-sonarr
      key: SONARR_API_KEY
      targetEnvName: SONARR_API_KEY
    - name: toolhive-radarr
      key: RADARR_API_KEY
      targetEnvName: RADARR_API_KEY
    - name: toolhive-prowlarr
      key: PROWLARR_API_KEY
      targetEnvName: PROWLARR_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          image: docker.io/node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
          command:
            - npx
          args:
            - -y
            - mcp-arr-server@1.7.3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
