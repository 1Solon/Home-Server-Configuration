---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homepage
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: secrets
  targetNamespace: home-dashboard
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: "./kubernetes/observability/homepage/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
    substitute:
      APP: *app
