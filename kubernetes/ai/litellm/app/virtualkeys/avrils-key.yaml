---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: avrils-key
spec:
  proxyRef: litellm
  secretName: litellm-avrils-key
  keyAlias: avrils-key
  # Created once with /user/new (alias Avril); the operator has no user resource.
  userID: avril
  # No Opus: it costs twice Sonnet against the Claude API credit.
  models:
    - glm-5.3-flash
    - claude-sonnet-5-5
    - claude-haiku-5-5
