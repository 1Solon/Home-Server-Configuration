---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cleanuparr
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: cleanuparr
  dependsOn:
    - name: kopiur-repository-home-media
      namespace: flux-system
  path: "./kubernetes/media/cleanuparr/app"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: cleanuparr-config
      KOPIUR_SOURCE_PVC: cleanuparr-config-kopiur-replacement
      KOPIUR_SCHEDULE: "51 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
