---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: job-ops-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Only read while the users table is empty: it seeds the first admin, so /api/auth/setup is never open.
        BASIC_AUTH_USER: "{{ .JOB_OPS_ADMIN_USER }}"
        BASIC_AUTH_PASSWORD: "{{ .JOB_OPS_ADMIN_PASSWORD }}"
        SSO_OIDC_CLIENT_ID: "{{ .JOB_OPS_OIDC_CLIENT_ID }}"
        SSO_OIDC_CLIENT_SECRET: "{{ .JOB_OPS_OIDC_CLIENT_SECRET }}"
        LLM_API_KEY: "{{ .DGX_SPARK_API_KEY }}"
  dataFrom:
    - extract:
        key: job-ops
    - extract:
        key: ai-api-keys
