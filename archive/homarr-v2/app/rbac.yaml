---
# Read-only access for homarr's Kubernetes tool, based on the homarr-labs chart
# (charts/homarr/templates/homarr-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homarr
  labels:
    app.kubernetes.io/instance: homarr
    app.kubernetes.io/name: homarr
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  # homarr only shows secret names and counts, and its Resources panel fails
  # without this. Accepted trade-off: list returns every secret's contents, so
  # homarr admins and the MCP gateway can read all secret values through it.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      # Read to resolve a pod's owning Deployment (missing from the upstream chart)
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: &app homarr
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: *app
subjects:
  - kind: ServiceAccount
    name: *app
    namespace: homarr
