---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qui-db-secret
    template:
      engineVersion: v2
      data:
        QUI__DATABASE_ENGINE: postgres
        QUI__DATABASE_HOST: postgres-rw.databases.svc.cluster.local
        QUI__DATABASE_PORT: "5432"
        QUI__DATABASE_NAME: qui
        QUI__DATABASE_USER: qui
        QUI__DATABASE_PASSWORD: "{{ .QUI_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: qui
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: qui
        INIT_POSTGRES_PASS: "{{ .QUI_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: qui
