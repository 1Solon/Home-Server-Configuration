---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: recyclarr
spec:
  interval: 30m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 9.0.0
  url: oci://ghcr.io/recyclarr/charts/recyclarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: recyclarr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    apiKey:
      existingSecret: recyclarr-api-key
    configs:
      existingConfigMap: recyclarr-configmap
    settings:
      content: |
        server:
          logging:
            # VictoriaLogs collects stdout JSON logs; skip duplicate log files in the ephemeral data dir.
            files: false
    env:
      - name: TZ
        value: ${TZ}
    envFrom:
      - secretRef:
          name: recyclarr-secret
    persistence:
      state:
        existingClaim: recyclarr-miroir
    serviceMonitor:
      enabled: true
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        # Upstream measured ~280Mi peak for one Sonarr + one Radarr instance including guide cache.
        memory: 512Mi
