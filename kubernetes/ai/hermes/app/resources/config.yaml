---
group_sessions_per_user: true
model:
  provider: openai-codex
  default: gpt-5.6-luna
auxiliary:
  vision:
    provider: openai-codex
    model: gpt-5.6-luna
  curator:
    provider: openai-codex
    model: gpt-5.6-sol
web:
  search_backend: searxng
  extract_backend: firecrawl
tools:
  tool_search:
    enabled: "on"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  grafana:
    url: http://mcp-grafana.observability.svc.cluster.local:8000/mcp
    timeout: 60
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
memory:
  provider: mnemosyne
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  reasoning_effort: high
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 33
