---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-pilot-restore
  namespace: flux-system
spec:
  suspend: false
  targetNamespace: home-media
  path: ./kubernetes/storage/kopiur/restores/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur-repository-home-media
      namespace: flux-system
    - name: miroir-config
      namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 30m
  postBuild:
    substitute:
      APP: seerr-config-cache
      KOPIUR_RESTORE_CAPACITY: 15Gi
      KOPIUR_RESTORE_PVC: seerr-config-cache-kopiur-replacement
