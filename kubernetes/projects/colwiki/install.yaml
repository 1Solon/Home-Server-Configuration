---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app otterwiki
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: colwiki
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository-colwiki
      namespace: flux-system
  path: "./kubernetes/projects/colwiki/app"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: otterwiki
      KOPIUR_SOURCE_PVC: otterwiki-kopiur-replacement
      KOPIUR_SCHEDULE: "19 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
