---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homarr
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: *app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository-homarr
      namespace: flux-system
    - name: external-secrets-stores
      namespace: secrets
    - name: miroir-config
      namespace: flux-system
  path: "./kubernetes/observability/homarr/app"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: homarr
      KOPIUR_SCHEDULE: "31 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
