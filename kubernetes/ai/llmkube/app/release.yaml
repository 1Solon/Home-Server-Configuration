---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: llmkube
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.9.23
  url: oci://ghcr.io/defilantech/charts/llmkube
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    namespace: ai

    crds:
      install: true
      keep: true

    controllerManager:
      replicaCount: 1
      leaderElection:
        enabled: false

    metrics:
      enabled: true
      secure: false

    prometheus:
      serviceMonitor:
        enabled: true
        interval: 30s
      inferencePodMonitor:
        enabled: true
        interval: 30s
      prometheusRule:
        enabled: true
        namespace: observability

    # Enable llmkube's native remote-model downloader and cache plumbing.
    # InferenceServices can reuse the existing RWX NFS PVC with modelCache.claimName;
    # perService mode avoids provisioning an unused second shared 100 GiB claim.
    modelCache:
      enabled: true
      mode: perService
      size: 25Gi
      storageClass: miroir-ephemeral
