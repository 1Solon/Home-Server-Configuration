---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname talos-kmsg
  namespace: flux-system
spec:
  dependsOn:
    - name: victoria-logs
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 1h
  path: "./kubernetes/observability/victoria-logs/talos-kmsg"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: true
