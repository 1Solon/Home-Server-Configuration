---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suwayomi-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: suwayomi-db-secret
    template:
      engineVersion: v2
      data:
        DATABASE_TYPE: POSTGRESQL
        DATABASE_URL: postgresql://postgres-rw.databases.svc.cluster.local:5432/suwayomi
        DATABASE_USERNAME: suwayomi
        DATABASE_PASSWORD: "{{ .SUWAYOMI_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: suwayomi
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: suwayomi
        INIT_POSTGRES_PASS: "{{ .SUWAYOMI_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: suwayomi
