---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  # renovate: depName=ghcr.io/perfectra1n/kubesearch-mcp
  image: ghcr.io/perfectra1n/kubesearch-mcp:sha-405e7b2@sha256:6d37df97523963d6457bb7306534518b7fbf2559468ce779afa35e39da768ee7
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    # SQLite query scratch files need the writable cache mount; /tmp is read-only.
    - name: SQLITE_TMPDIR
      value: /data
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  groupRef:
    name: mcp-tools
