---
group_sessions_per_user: true
# Used by the vision and curator helpers below, which stay on Claude Haiku.
# OpenCode Go only serves Claude over the Anthropic messages API, but
# Hermes' built-in opencode-go provider sends Claude models to the OpenAI
# chat endpoint, which rejects them ("Model does not support this
# protocol"). This entry points at the same OpenCode Go account and forces
# the Anthropic format. Hermes adds /v1/messages to the URL itself.
providers:
  opencode-go-anthropic:
    api: https://opencode.ai/zen/go
    key_env: OPENCODE_GO_API_KEY
    transport: anthropic_messages
    models:
      claude-haiku-5-5:
        context_length: 1000000
        prompt_caching: true
model:
  provider: opencode-go
  default: deepseek-v4.1-flash
auxiliary:
  vision:
    provider: custom:opencode-go-anthropic
    model: claude-haiku-5-5
  curator:
    provider: custom:opencode-go-anthropic
    model: claude-haiku-5-5
web:
  search_backend: searxng
  extract_backend: firecrawl
browser:
  cdp_url: ws://browserless.ai.svc.cluster.local:3000
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  provider: mnemosyne
  memory_char_limit: 4000
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  reasoning_effort: max
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - browser
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 46
