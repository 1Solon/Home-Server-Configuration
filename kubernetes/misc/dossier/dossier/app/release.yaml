---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dossier
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      # A Service named dossier would otherwise inject DOSSIER_* variables into the app's own config namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      dossier:
        # Upstream supports one instance per database: the job queue and backups live in the process.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: dossier-db-init-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/aientech/dossier
              tag: v1.11.0@sha256:216df01e3f8adec7c807a4ab209edf253d18a5817eedc26a86fb53db9e570c6d
            env:
              TZ: ${TZ}
              DOSSIER_PUBLIC_URL: https://dossier.${LOCAL_DOMAIN}
              DOSSIER_TELEMETRY: "off"
              DOSSIER_AI_PROVIDER: openai
              # GLM-5.3 Flash on the DGX Sparks, which ignore API keys. Settings -> AI provider overrides these.
              DOSSIER_AI_URL: http://192.168.1.106:8888/v1
              DOSSIER_AI_MODEL: GLM-5.3-Flash-EXL3
              # The openai provider defaults to 120 s, too short when the Sparks are busy with other clients.
              DOSSIER_AI_TIMEOUT_SECONDS: "300"
            envFrom:
              - secretRef:
                  name: dossier-secret
            probes:
              # /api/health also checks the database, so a Postgres failover shouldn't restart the app.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Migrations run before the server starts.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: *securityContext
            # Upstream measured about 520 MiB with Chromium printing PDFs and sets a 1 GiB limit in its Compose file.
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Dossier
          gethomepage.dev/description: Job search, resumes and cover letters
          gethomepage.dev/group: Applications
          gethomepage.dev/icon: https://raw.githubusercontent.com/AienTech/dossier/main/src/app/icon.svg
          gethomepage.dev/pod-selector: app.kubernetes.io/name=dossier
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - dossier.${LOCAL_DOMAIN}
        rules:
          - backendRefs:
              - port: *port
                name: *app

    persistence:
      data:
        existingClaim: dossier
        advancedMounts:
          dossier:
            app:
              - path: /data
      # Chromium's scratch space, because Dossier launches it with --disable-dev-shm-usage.
      tmp:
        type: emptyDir
        advancedMounts:
          dossier:
            app:
              - path: /tmp
      next-cache:
        type: emptyDir
        advancedMounts:
          dossier:
            app:
              - path: /app/.next/cache
