---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrr-miroir
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: miroir-replicated
  resources:
    requests:
      storage: 5Gi
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: autobrr-miroir-restore
