---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dossier
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
  targetNamespace: *app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository-dossier
      namespace: flux-system
    - name: external-secrets-stores
      namespace: secrets
    - name: miroir-config
      namespace: flux-system
    - name: cloudnative-pg-cluster
      namespace: flux-system
  path: "./kubernetes/misc/dossier/dossier/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: dossier
      # After the app's nightly export at 03:00 Europe/Dublin, so the snapshot includes it.
      KOPIUR_SCHEDULE: "20 3 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
