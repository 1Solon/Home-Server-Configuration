---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: books
  commonMetadata:
    labels:
      app.kubernetes.io/name: audiobookshelf
  dependsOn:
    - name: kopiur-repository-books
      namespace: flux-system
  path: "./kubernetes/books/audiobookshelf/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: audiobookshelf-config
      KOPIUR_SOURCE_PVC: audiobookshelf-config-kopiur-replacement
      KOPIUR_SCHEDULE: "17 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
