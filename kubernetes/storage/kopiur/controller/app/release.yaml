---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kopiur
spec:
  interval: 30m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.10.8
  url: oci://ghcr.io/home-operations/charts/kopiur
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kopiur
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  values:
    installScope: cluster
    image:
      tag: 0.10.8
      digest: sha256:8d62c667ec20fc05b23a0eb10d2ce9be8a83c9eb60042ca2e23775c57a2175b2
    mover:
      image:
        tag: 0.10.8
        digest: sha256:6b079d549320d126e16a3beecf071997aaea6eb42a434316000484f6f14dc595
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        backupStaleAfterSeconds: 21600
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          folder: Storage
          matchLabels:
            dashboards: grafana
    webhook:
      image:
        tag: 0.10.8
        digest: sha256:7dbe59cdd08c24d8a11b7a1e1851d664be87e7005f7eb37a03d1da1e4c64187e
      failurePolicy: Fail
      serviceMonitor:
        enabled: true
        insecureSkipVerify: true
