---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name firecrawl
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .NUQ_DB_PASS }}"
        NUQ_DATABASE_URL: 'postgresql://postgres:{{ .NUQ_DB_PASS | urlquery }}@firecrawl-nuq-postgres.ai.svc.cluster.local:5432/postgres'
        NUQ_DATABASE_URL_LISTEN: 'postgresql://postgres:{{ .NUQ_DB_PASS | urlquery }}@firecrawl-nuq-postgres.ai.svc.cluster.local:5432/postgres'
  dataFrom:
    # Add a strong NUQ_DB_PASS field to the existing Firecrawl 1Password item.
    - extract:
        key: firecrawl
