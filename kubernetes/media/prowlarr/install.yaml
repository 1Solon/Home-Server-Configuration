---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  components:
    - ../../../components/ext-auth
  dependsOn:
    - name: external-secrets-stores
      namespace: secrets
    - name: cloudnative-pg-cluster
      namespace: flux-system
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: prowlarr
  path: "./kubernetes/media/prowlarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: prowlarr
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false