---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otterwiki-miroir
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: miroir-replicated
  resources:
    requests:
      storage: 20Gi
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: otterwiki-miroir-restore
