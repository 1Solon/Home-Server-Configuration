---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "flux-system"
data:
  TZ: "Europe/Dublin"
  LOCAL_DOMAIN: "local.solonsstuff.com"
  REMOTE_DOMAIN: "solonsstuff.com"

  # Ips for services
  TRUENAS_IP: 192.168.1.152
  GATEWAY_EXTERNAL_IP: 192.168.5.161
  GATEWAY_INTERNAL_IP: 192.168.5.163
  JELLYFIN_IP: 192.168.5.162
  SYNCTHING_IP: 192.168.5.156
  OPDS_PROXY_IP: 192.168.5.165
