---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "2"
  miroir.home-operations.com/pool: data
  miroir.home-operations.com/quorum: freeze
  miroir.home-operations.com/allowRemoteVolumeAccess: "true"
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-replicated-local
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "2"
  miroir.home-operations.com/pool: data
  miroir.home-operations.com/quorum: freeze
  miroir.home-operations.com/allowRemoteVolumeAccess: "false"
  csi.storage.k8s.io/fstype: ext4
---
# Disposable VolSync cache/staging data only. Application data must use a
# replicated class selecting the `data` pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-ephemeral
provisioner: miroir.home-operations.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/replicas: "1"
  miroir.home-operations.com/pool: client
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: miroir-snap
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: miroir.home-operations.com
deletionPolicy: Delete
