---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Both must start with sk-. Changing the salt key makes stored
        # credentials in the database unreadable.
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        UI_USERNAME: "{{ .LITELLM_UI_USERNAME }}"
        UI_PASSWORD: "{{ .LITELLM_UI_PASSWORD }}"
        # Role and database come from the CNPG cluster (managed role + Database).
        DATABASE_URL: "postgresql://litellm:{{ .LITELLM_POSTGRES_PASSWORD | urlquery }}@postgres-rw.databases.svc.cluster.local:5432/litellm"
        # Console key from the org linked to the Max plan, which carries its
        # monthly API credit.
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        DGX_SPARK_API_KEY: "{{ .DGX_SPARK_API_KEY }}"
        # Authentik OAuth2 provider "litellm".
        GENERIC_CLIENT_ID: "{{ .LITELLM_OIDC_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LITELLM_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: ai-api-keys
