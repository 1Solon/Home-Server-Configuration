---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dgx-spark
  namespace: flux-system
spec:
  dependsOn:
    - name: tailscale
      namespace: flux-system
  path: "./kubernetes/ai/dgx-spark/app"
  targetNamespace: ai
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
