---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./release.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - ./config/recyclarr.yaml
      - ./config/settings.yml
      - ./config/guides/metadata.json
      - ./config/guides/sonarr-quality-size-series.json
      - ./config/guides/sonarr-quality-size-anime.json
generatorOptions:
  disableNameSuffixHash: true
