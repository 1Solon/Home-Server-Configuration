---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
    name: talos
spec:
    talos:
        # renovate: datasource=custom.talos-factory depName=siderolabs/talos
        version: v1.13.8
    policy:
        timeout: 30m
        debug: true
        placement: hard
        # Do not reboot a node while Miroir volumes are still detaching.
        waitForVolumeDetach: true
    drain:
        enabled: true
    healthChecks:
        - apiVersion: volsync.backube/v1alpha1
          kind: ReplicationSource
          expr: |-
              status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
        - apiVersion: miroir.home-operations.com/v1alpha1
          kind: MiroirVolume
          expr: |-
              status.phase == 'Ready'
