---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: Repository
    name: garage
  sources:
    - pvc:
        name: ${KOPIUR_SOURCE_PVC:=${APP}}
  copyMethod: Direct
  retention:
    keepHourly: ${KOPIUR_RETAIN_HOURLY:=0}
    keepDaily: ${KOPIUR_RETAIN_DAILY:=7}
    keepWeekly: ${KOPIUR_RETAIN_WEEKLY:=0}
    keepMonthly: ${KOPIUR_RETAIN_MONTHLY:=0}
  defaultDeletionPolicy: Delete
  deletion:
    onPolicyDelete: Retain
  suspend: false
  mover:
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      capabilities:
        add:
          - DAC_OVERRIDE
    ttlSecondsAfterFinished: 3600
