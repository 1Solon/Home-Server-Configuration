      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  extraArgs:
    - --alias
    - Ornith-1.0-35B
    - --verbosity
    - "4"
    - --chat-template-kwargs
    - '{"preserve_thinking": true}'
    - --reasoning-format
    - deepseek
    - --no-mmap
    - --top-k
    - "20"
    - --top-p
    - "0.95"
    - --min-p
    - "0"
    - --no-context-shift
