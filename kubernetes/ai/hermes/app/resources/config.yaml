---
group_sessions_per_user: true
model:
  provider: opencode-go
  default: glm-5.3-flash
auxiliary:
  vision:
    provider: opencode-go
    model: glm-5.3-flash
  curator:
    provider: opencode-go
    model: glm-5.3
web:
  search_backend: searxng
  extract_backend: firecrawl
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  provider: mnemosyne
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  reasoning_effort: max
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 46
