---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qwen-image
  namespace: flux-system
spec:
  dependsOn:
    - name: nvidia-device-plugin
    - name: miroir-config
      namespace: flux-system
  path: "./kubernetes/ai/qwen-image/app"
  targetNamespace: ai
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  # The first start downloads ~10 GiB of weights before the server is ready.
  timeout: 30m
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
