---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Requires a 1Password item "toolhive" with UNIFI_NETWORK_USERNAME and
# UNIFI_NETWORK_PASSWORD fields (operator credentials for the UniFi controller).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-network-username
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        UNIFI_NETWORK_USERNAME: "{{ .UNIFI_NETWORK_USERNAME }}"
  dataFrom:
    - extract:
        key: toolhive
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-network-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        UNIFI_NETWORK_PASSWORD: "{{ .UNIFI_NETWORK_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive
