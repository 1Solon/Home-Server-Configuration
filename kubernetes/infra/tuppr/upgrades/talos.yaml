---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
    name: talos
spec:
    talos:
        # renovate: datasource=custom.talos-factory depName=siderolabs/talos
        version: v1.13.9
    policy:
        timeout: 30m
        debug: true
        placement: hard
        # Do not reboot a node while Miroir volumes are still detaching.
        waitForVolumeDetach: true
    drain:
        enabled: true
    healthChecks:
        - apiVersion: volsync.backube/v1alpha1
          kind: ReplicationSource
          expr: |-
              status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: Snapshot
          expr: |-
              status.conditions.filter(c, c.type == "Reconciling").all(c, c.status == "False")
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: Restore
          expr: |-
              status.conditions.filter(c, c.type == "Reconciling").all(c, c.status == "False")
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: Repository
          expr: |-
              status.conditions.exists(c, c.type == "Ready" && c.status == "True")
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: SnapshotPolicy
          expr: |-
              status.conditions.exists(c, c.type == "Ready" && c.status == "True")
        - apiVersion: kopiur.home-operations.com/v1alpha1
          kind: SnapshotSchedule
          expr: |-
              status.conditions.exists(c, c.type == "Ready" && c.status == "True")
        - apiVersion: miroir.home-operations.com/v1alpha1
          kind: MiroirVolume
          expr: |-
              status.phase == 'Ready'
