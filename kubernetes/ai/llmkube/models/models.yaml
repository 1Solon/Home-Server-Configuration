---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: glm-4-7-flash
spec:
  source: https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/0d32489ecb9db6d2a4fc93bd27ef01519f95474d/GLM-4.7-Flash-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: -1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: glm-4-7-flash
spec:
  modelRef: glm-4-7-flash
  modelCache:
    persistence: Cached
  runtime: llamacpp
  mode: chat
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:190d82d2f35ff25539f181328bae0659a21cbe4e321259193216ed7d2d7b5e67
  bindAddress: 0.0.0.0
  contextSize: 131072
  parallelSlots: 1
  flashAttention: true
  moeCPULayers: 21
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kube5
  resources:
    cpu: 500m
    memory: 4Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probeOverrides:
    startup:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 540
    liveness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  extraArgs:
    - --alias
    - GLM-4.7-Flash
    - --verbosity
    - "4"
    - --jinja
    - --reasoning-format
    - deepseek
    - --no-mmap
    - --batch-size
    - "8192"
    - --ubatch-size
    - "2048"
    - --threads-batch
    - "8"
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --temp
    - "0.7"
    - --top-p
    - "1.0"
    - --min-p
    - "0.01"
    - --repeat-penalty
    - "1.0"
    - --no-context-shift
