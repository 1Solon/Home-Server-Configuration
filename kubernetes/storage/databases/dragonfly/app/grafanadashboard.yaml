---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dragonfly
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  url: https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/b28637d78d828f80a3b3fd76acaa2dd6e3c28603/monitoring/grafana-dashboard.json
