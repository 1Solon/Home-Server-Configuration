---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: toolhive-embedding
value: 0
globalDefault: false
preemptionPolicy: Never
description: Background tool embeddings must not preempt application workloads.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
spec:
  modelRef: embed
  runtime: llamacpp
  # CPU embedding service for the ToolHive gateway tool search.
  # Bound concurrent embedding work: eight slots and 2048-token batches
  # exceeded the 4Gi limit during ToolHive indexing.
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:fffcc1af1105bafc713a47b6680fb7cf5856ed43ea2e9e8bca5a62bbd6365edf
  replicas: 1
  priorityClassName: toolhive-embedding
  contextSize: 8192
  parallelSlots: 2
  flashAttention: true
  batchSize: 1024
  uBatchSize: 1024
  resources:
    cpu: "2"
    memory: 4Gi
  mode: embedding
  extraArgs:
    - --alias
    - embed
    - --cont-batching
    - --cache-ram
    - "0"
    - --threads
    - "2"
    - --threads-batch
    - "2"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
