---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: jellyfin
  dependsOn:
    - name: kopiur-repository-home-media
      namespace: flux-system
  path: "./kubernetes/media/jellyfin/app"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: jellyfin-config
      KOPIUR_SOURCE_PVC: jellyfin-config-kopiur-replacement
      KOPIUR_SCHEDULE: "4 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
