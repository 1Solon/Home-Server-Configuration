---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: libation
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: books
  commonMetadata:
    labels:
      app.kubernetes.io/name: libation
  dependsOn:
    - name: kopiur-repository-books
      namespace: flux-system
  path: ./kubernetes/books/libation/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: libation-config
      KOPIUR_SOURCE_PVC: libation-config-kopiur-replacement
      KOPIUR_SCHEDULE: "27 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
