---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-kmsg
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  interval: 15m
  values:
    controllers:
      talos-kmsg:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Talos sends the logs to 127.0.0.1, so this pod has to use the node's own network.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          priorityClassName: system-node-critical
          tolerations:
            - operator: Exists
        containers:
          app:
            image:
              repository: docker.io/timberio/vector
              tag: 0.58.0-distroless-libc@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
            args: ["--config", "/etc/vector/vector.yaml"]
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        enabled: false
    persistence:
      config:
        type: configMap
        name: talos-kmsg-configmap
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true
      data:
        type: hostPath
        hostPath: /var/lib/talos-kmsg
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/vector
