---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
    - ../../../components/ext-auth
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: sonarr
  dependsOn:
    - name: kopiur-repository-home-media
      namespace: flux-system
    - name: external-secrets-stores
      namespace: secrets
    - name: miroir-config
      namespace: flux-system
    - name: cloudnative-pg-cluster
      namespace: flux-system
  path: "./kubernetes/media/sonarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      EXT_AUTH_TARGET: sonarr
      APP: sonarr-config
      KOPIUR_SOURCE_PVC: sonarr-config-kopiur-replacement
      KOPIUR_SCHEDULE: "40 1 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
