---
apiVersion: v1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
spec:
  modelRef: embed
  runtime: llamacpp
  # CPU embedding service for the ToolHive gateway tool search.
  # Qwen3-Embedding-0.6B Q8_0 (~0.6GiB weights) on two cores is ample for
  # one client; scale out replicas if tool indexing latency becomes visible.
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:fffcc1af1105bafc713a47b6680fb7cf5856ed43ea2e9e8bca5a62bbd6365edf
  replicas: 1
  priority: normal
  contextSize: 32768
  parallelSlots: 8
  flashAttention: true
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "2"
    memory: 4Gi
  mode: embedding
  extraArgs:
    - --alias
    - embed
    - --cont-batching
    - --cache-ram
    - "0"
    - --threads
    - "4"
    - --threads-batch
    - "4"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
