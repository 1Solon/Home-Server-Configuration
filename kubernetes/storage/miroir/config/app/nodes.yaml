---
# Every schedulable node is mapped so replicated volumes can be consumed
# remotely. During coexistence these loopfile pools are client/tie-breaker
# only; application StorageClasses select the separate `data` pool.
apiVersion: miroir.home-operations.com/v1alpha1
kind: MiroirNode
metadata:
  name: kube1
  labels:
    miroir.home-operations.com/node-group: linux
  annotations:
    # Keep the adopted node when this bootstrap manifest is removed in phase 2.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  pools:
    - name: client
      loopfile:
        baseDir: /var/lib/miroir
    - name: data
      lvmthin:
        device: /dev/disk/by-partlabel/r-longhorn-csi
