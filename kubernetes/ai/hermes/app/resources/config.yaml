---
model:
  provider: custom:qwen-local
  default: Qwen3.6-35B-A3B
providers:
  qwen-local:
    name: qwen-local
    api: http://qwen3-6-35b-a3b.ai.svc.cluster.local:8080/v1
    transport: chat_completions
    default_model: Qwen3.6-35B-A3B
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
      thinking_budget_tokens: 512
auxiliary:
  vision:
    provider: auto
  curator:
    provider: auto
  # Auto-title competes with the first user turn for llama.cpp's single slot.
  # Keep this cosmetic auxiliary direct so it cannot queue the visible answer.
  title_generation:
    provider: auto
    reasoning_effort: none
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
      thinking_budget_tokens: 0
web:
  backend: firecrawl
tools:
  tool_search:
    enabled: "on"
dashboard:
  theme: mono
  font: jetbrains-mono
mcp_servers:
  grafana:
    url: http://mcp-grafana.observability.svc.cluster.local:8000/mcp
    timeout: 60
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
memory:
  provider: mnemosyne
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  reasoning_effort: medium
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  api_server:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
  discord:
    - clarify
    - delegation
    - file
    - memory
    - skills
    - terminal
    - todo
    - web
_config_version: 33
