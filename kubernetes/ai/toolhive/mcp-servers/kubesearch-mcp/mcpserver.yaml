---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  # renovate: depName=ghcr.io/perfectra1n/kubesearch-mcp
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    # SQLite query scratch files need the writable cache mount; /tmp is read-only.
    - name: SQLITE_TMPDIR
      value: /data
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  groupRef:
    name: mcp-tools
