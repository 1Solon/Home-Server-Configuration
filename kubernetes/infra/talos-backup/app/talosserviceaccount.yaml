---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/talos.dev/serviceaccount_v1alpha1.json
# Talos turns this into a secret holding a talosconfig that can only take
# etcd snapshots. The control-plane machine config has to allow the
# os:etcd:backup role for kube-system (talos/control-plane/10-api-access.yaml).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup
spec:
  roles:
    - os:etcd:backup
