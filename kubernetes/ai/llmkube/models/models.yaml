---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen-agentworld-35b-a3b
spec:
  source: pvc://llmkube-models/unsloth/Qwen-AgentWorld-35B-A3B-GGUF/3a305abf5cfd119ee999dfe929c433746edd8d63/Qwen-AgentWorld-35B-A3B-UD-Q4_K_M.gguf
  format: gguf
  quantization: UD-Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: -1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-agentworld-35b-a3b
spec:
  modelRef: qwen-agentworld-35b-a3b
  runtime: llamacpp
  mode: chat
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:cab262d82fc13edd1c3721b357260d2ba5c7495dff2ddfeba948c38336d86ab9
  bindAddress: 0.0.0.0
  contextSize: 65536
  parallelSlots: 1
  flashAttention: true
  # 15 is the minimum CPU MoE offload that fits the 65,536-token context on 16 GiB VRAM.
  # 14 fails while allocating the CUDA compute buffer; all 41/41 model layers remain offloaded.
  moeCPULayers: 15
  # reasoningBudget: 16000
  # reasoningBudgetMessage: "\n\nSYSTEM ERROR!: You have exceeded the reasoning budget. Thinking has been terminiated. You must answer now. "
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kube5
  resources:
    cpu: 500m
    memory: 4Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probeOverrides:
    startup:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 540
    liveness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  extraArgs:
    - --alias
    - Qwen-AgentWorld-35B-A3B
    - --verbosity
    - "4"
    - --reasoning-format
    - deepseek
    - --no-mmap
    - --temp
    - "0.6"
    - --top-k
    - "20"
    - --top-p
    - "0.95"
    - --min-p
    - "0"
    - --no-context-shift
