  #         - sonarr_main
  #         - speedtest_tracker
  #         - authentik
  #         - litellm
  #         - open-webui
  #       roles:
  #         - _crunchypgbouncer
  #         - prowlarr
  #         - radarr
  #         - sonarr
  #         - speedtest-tracker
  #         - authentik
  #         - litellm
  #         - open-webui
