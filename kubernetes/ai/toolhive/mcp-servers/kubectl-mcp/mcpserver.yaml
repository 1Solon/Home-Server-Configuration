---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl
spec:
  # renovate: depName=docker.io/rohitghumare64/kubectl-mcp-server
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      # Image runs as UID 10001 since 2.0.0 (WORKDIR /home/mcp is 10001-owned);
      # ToolHive otherwise defaults to 1000 and the server can't read its cwd.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mcp
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
            # 2.0.0 refuses a non-loopback bind without auth; the ToolHive proxy
            # reaches it over the headless Service (same unauthenticated, read-only
            # posture as 1.x).
            - --allow-unauthenticated
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
  groupRef:
    name: mcp-tools
