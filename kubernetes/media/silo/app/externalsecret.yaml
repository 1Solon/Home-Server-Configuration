---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # App (openssl rand -base64 48). Encrypts stored credentials; losing it
        # makes them unrecoverable, so 1Password is the backup.
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"

        # Database
        DATABASE_URL: "postgres://silo:{{ .SILO_POSTGRES_PASSWORD }}@pgvector17-rw.databases.svc.cluster.local:5432/silo?sslmode=disable"

        # Postgres init
        INIT_POSTGRES_DBNAME: silo
        INIT_POSTGRES_HOST: pgvector17-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: silo
        INIT_POSTGRES_PASS: "{{ .SILO_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: silo
