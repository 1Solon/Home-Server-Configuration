---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app reactive-resume
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur
  targetNamespace: job-ops
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository-job-ops
      namespace: flux-system
    - name: external-secrets-stores
      namespace: secrets
    - name: miroir-config
      namespace: flux-system
    - name: cloudnative-pg-cluster
      namespace: flux-system
  path: "./kubernetes/misc/job-ops/reactive-resume/app"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: reactive-resume
      KOPIUR_SCHEDULE: "53 1 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
