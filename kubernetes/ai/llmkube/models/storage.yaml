---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llmkube-models
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: llmkube-models
    namespace: ai
  nfs:
    server: ${TRUENAS_IP}
    path: /mnt/STORAGE-01/Models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llmkube-models
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: llmkube-models
