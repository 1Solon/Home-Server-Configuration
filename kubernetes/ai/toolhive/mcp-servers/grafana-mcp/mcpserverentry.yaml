---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
# Points at the existing mcp-grafana deployment (kubernetes/observability/grafana/mcp),
# so the gateway aggregates it without deploying a second copy.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: grafana
spec:
  remoteUrl: http://mcp-grafana.observability.svc.cluster.local:8000/mcp
  transport: streamable-http
  groupRef:
    name: mcp-tools
