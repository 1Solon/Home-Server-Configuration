---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        DISCORD_ALLOWED_USERS: "{{ .DISCORD_ALLOWED_USERS }}"
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HERMES_DASHBOARD_OIDC_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_DASHBOARD_OIDC_CLIENT_SECRET }}"
        OPENCODE_GO_API_KEY: "{{ .OPENCODE_GO_API_KEY }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: ai-api-keys
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kept apart from the hermes secret so the app's private key is mounted as a file and never lands in the
# agent's environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        app-id: "{{ .GITHUB_APP_ID }}"
        private-key.pem: "{{ .GITHUB_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: hermes
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Mounted only into the LiveSync Bridge sidecar, so the vault's keys never reach the agent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-obsidian-bridge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # LiveSync uses the E2EE passphrase for path obfuscation too. idDerivationKey is required for vaults made
        # by LiveSync 0.25+, or the plugin can't read what the bridge writes.
        config.json: |
          {
            "peers": [
              {
                "type": "couchdb",
                "name": "vault-db",
                "group": "vault",
                "url": "http://couchdb.obsidian.svc.cluster.local:5984",
                "database": "obsidian",
                "username": {{ .COUCHDB_USER | toJson }},
                "password": {{ .COUCHDB_PASSWORD | toJson }},
                "passphrase": {{ .LIVESYNC_E2EE_PASSPHRASE | toJson }},
                "obfuscatePassphrase": {{ .LIVESYNC_E2EE_PASSPHRASE | toJson }},
                "idDerivationKey": {{ .ID_RECOVERY_CODE | toJson }},
                "baseDir": "",
                "useRemoteTweaks": true
              },
              {
                "type": "storage",
                "name": "vault-files",
                "group": "vault",
                "baseDir": "/vault/",
                "scanOfflineChanges": true
              }
            ]
          }
  dataFrom:
    - extract:
        key: obsidian-livesync
