---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bifrost-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        BF_DISCORD_TOKEN: "{{ .BF_DISCORD_TOKEN }}"
        BF_DISCORD_APP_ID: "{{ .BF_DISCORD_APP_ID }}"
        BF_DISCORD_OWNER_ID: "{{ .BF_DISCORD_OWNER_ID }}"
        BF_FLUXER_TOKEN: "{{ .BF_FLUXER_TOKEN }}"
        BF_FLUXER_APP_ID: "{{ .BF_FLUXER_APP_ID }}"
        BF_FLUXER_OWNER_ID: "{{ .BF_FLUXER_OWNER_ID }}"
  dataFrom:
    - extract:
        key: bifrost
