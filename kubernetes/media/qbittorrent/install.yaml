---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: qbittorrent
  dependsOn:
    - name: kopiur-repository-home-media
      namespace: flux-system
  path: "./kubernetes/media/qbittorrent/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: qbittorrent-config
      KOPIUR_SOURCE_PVC: qbittorrent-config-kopiur-replacement
      KOPIUR_SCHEDULE: "16 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qui
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
  targetNamespace: home-media
  dependsOn:
    - name: qbittorrent
    - name: kopiur-repository-home-media
      namespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: qui
  path: "./kubernetes/media/qbittorrent/ui"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: qui
      KOPIUR_SOURCE_PVC: qui-kopiur-replacement
      KOPIUR_SCHEDULE: "22 */6 * * *"
      KOPIUR_SUSPEND: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seedboxapi-config-kopiur
  namespace: flux-system
spec:
  targetNamespace: home-media
  dependsOn:
    - name: qbittorrent
    - name: kopiur-repository-home-media
      namespace: flux-system
  path: "./kubernetes/components/kopiur-standalone"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: seedboxapi-config
      KOPIUR_SOURCE_PVC: seedboxapi-config-kopiur-replacement
      KOPIUR_SCHEDULE: "25 */6 * * *"
      KOPIUR_SUSPEND: "false"
