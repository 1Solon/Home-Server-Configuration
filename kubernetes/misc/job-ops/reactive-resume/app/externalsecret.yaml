---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: reactive-resume-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AUTH_SECRET: "{{ .REACTIVE_RESUME_AUTH_SECRET }}"
        ENCRYPTION_SECRET: "{{ .REACTIVE_RESUME_ENCRYPTION_SECRET }}"
        OAUTH_CLIENT_ID: "{{ .REACTIVE_RESUME_OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .REACTIVE_RESUME_OIDC_CLIENT_SECRET }}"
        AI_API_KEY: "{{ .DGX_SPARK_API_KEY }}"

        # Database
        DATABASE_URL: "postgresql://reactive_resume:{{ .REACTIVE_RESUME_POSTGRES_PASSWORD }}@postgres17.databases.svc.cluster.local:5432/reactive_resume"

        # Postgres init
        INIT_POSTGRES_DBNAME: reactive_resume
        INIT_POSTGRES_HOST: postgres17.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: reactive_resume
        INIT_POSTGRES_PASS: "{{ .REACTIVE_RESUME_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: reactive-resume
    - extract:
        key: ai-api-keys
