---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    cron: "${KOPIUR_SCHEDULE:=17 */6 * * *}"
    timezone: ${KOPIUR_TIMEZONE:=Etc/UTC}
    runOnCreate: false
    suspend: ${KOPIUR_SUSPEND:=true}
    concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 10
  deletion:
    onScheduleDelete: Retain
