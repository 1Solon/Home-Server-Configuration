---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# Members are defragmented one at a time (init containers run in order).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
spec:
  schedule: "30 3 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - &defrag
              name: kube3
              image: ghcr.io/siderolabs/talosctl:v1.14.5@sha256:0b852e35c1f513ee5eacc22183d6193486012420569fde39fcd5260c51938443
              args: ["--nodes", "192.168.1.103", "etcd", "defrag"]
              env:
                - name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
            - <<: *defrag
              name: kube2
              args: ["--nodes", "192.168.1.102", "etcd", "defrag"]
          containers:
            - <<: *defrag
              name: kube1
              args: ["--nodes", "192.168.1.101", "etcd", "defrag"]
          volumes:
            - name: talos-secrets
              secret:
                secretName: etcd-defrag
