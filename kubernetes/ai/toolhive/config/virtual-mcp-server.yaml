---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingModel: embeddinggemma-2
      embeddingProvider: openai
      # LLMKube's embeddinggemma-2 via LiteLLM (key toolhive-key), which
      # auto-registers it from the InferenceService.
      # The optimizer has no query/document prefix setting, so EmbeddingGemma's
      # task prompts are not applied.
      # ToolHive 0.51.1 emits EmbeddingServiceManual on every reconciliation.
      # embeddingServerRef only supports ToolHive-managed TEI servers, so keep
      # the explicit URL.
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingServiceTimeout: 180s
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-toolhive-key
                  key: key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
  # Shares the cluster Dragonfly (firecrawl does the same). db 1 keeps the
  # MCP session keyspace separate from the default db.
  sessionStorage:
    address: dragonfly.databases.svc.cluster.local:6379
    db: 1
    keyPrefix: "toolhive:vmcp:"
    provider: redis
