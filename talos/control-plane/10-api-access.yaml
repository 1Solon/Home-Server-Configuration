---
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
        - os:reader
        # Lets the talos-backup CronJob in kube-system take etcd snapshots.
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - kube-system
        - ai
