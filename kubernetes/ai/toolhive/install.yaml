---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-crds
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  targetNamespace: flux-system
  path: ./kubernetes/ai/toolhive/crds
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive
  namespace: flux-system
spec:
  dependsOn:
    - name: toolhive-crds
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/ai/toolhive/app
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &config toolhive-config
  namespace: flux-system
spec:
  dependsOn:
    - name: toolhive
    # Gateway session storage.
    - name: dragonfly-cluster
    # The optimizer's embedding backend.
    - name: llmkube-models
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *config
  interval: 30m
  retryInterval: 1m
  path: ./kubernetes/ai/toolhive/config
  wait: true
  # The gateway reports Degraded whenever any MCP server behind it is unhealthy.
  # Count that as healthy here: toolhive-servers waits on this Kustomization,
  # so otherwise one broken server blocks the very deploy that would fix it.
  healthCheckExprs:
    - apiVersion: toolhive.stacklok.dev/v1beta1
      kind: VirtualMCPServer
      current: status.observedGeneration == metadata.generation && status.phase in ['Ready', 'Degraded']
      failed: status.phase == 'Failed'
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &servers toolhive-servers
  namespace: flux-system
spec:
  dependsOn:
    - name: toolhive-config
    - name: external-secrets-stores
      namespace: secrets
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *servers
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/ai/toolhive/mcp-servers
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
