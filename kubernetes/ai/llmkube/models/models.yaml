---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
spec:
  # The main GGUF already carries the MTP head (blk.64.nextn.*), so draft-mtp needs no companion file.
  source: hf://unsloth/Qwen3.8-27B-GGUF@4ca720788d1e01f1bff70c033e0d0028fd02e502
  files:
    - Qwen3.8-27B-UD-IQ4_XS.gguf
  sha256: 40fac4050e940397dbf13087afd50f4734a11805bf9d65ef8ddd7483470e6199
  format: gguf
  quantization: UD-IQ4_XS
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
spec:
  modelRef: qwen3-8-27b
  speculativeDecoding:
    type: draft-mtp
    nDraftMax: 2
  modelCache:
    persistence: Cached
  runtime: llamacpp
  mode: chat
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:917569d70ebd333d3d80877ac7bb1d9f9b59c1b34bfccf4e287bbe18d37aaa0a
  # Dense model: every layer must stay in VRAM or prompt processing (TTFT) collapses.
  # contextSize is left unset so --fit shrinks the context, not the GPU layer count.
  parallelSlots: 2
  flashAttention: true
  jinja: true
  batchSize: 2048
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kube5
  resources:
    cpu: "4"
    # Weights run from VRAM; host memory holds the mmap'd GGUF, the 10Gi prompt cache
    # and recurrent-state checkpoints (~150Mi each) used for prompt-cache reuse.
    hostMemory: 16Gi
    memoryLimit: 34Gi
    gpu: 1
  env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
  extraArgs:
    - --kv-unified
    - --cache-ram
    - "10240"
    - --reasoning-preserve
    - --alias
    - qwen3.8-27b
    - --verbosity
    - "3"
    - --fit
    - "on"
    - --fit-target
    - "256"
    - --fit-ctx
    - "32768"
    # llmkube 0.9.23 injects 99 whenever a GPU is requested; reset it so --fit can choose.
    - --n-gpu-layers
    - "-1"
    - --spec-draft-type-k
    - q4_0
    - --spec-draft-type-v
    - q4_0
    # Qwen thinking-mode sampling defaults from the model card; clients may override.
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0.0"
    # Only sampling and embedding lookups run on the CPU now.
    - --threads
    - "4"
    - --seed
    - "42"
    - --timeout
    - "7200"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
      startup:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 360
      liveness:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 6
      readiness:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
        failureThreshold: 6
