---
group_sessions_per_user: true
model:
  provider: dgx-spark
  default: GLM-5.3-Flash-EXL3
# GLM-5.3 Flash on the two DGX Sparks (head 192.168.1.106, outside the cluster). OpenCode Go stays
# available through OPENCODE_GO_API_KEY for /model.
providers:
  dgx-spark:
    name: DGX Sparks
    base_url: http://192.168.1.106:8888/v1
    key_env: DGX_SPARK_API_KEY
    default_model: GLM-5.3-Flash-EXL3
    context_length: 1048576
    models:
      GLM-5.3-Flash-EXL3:
        supports_vision: true
auxiliary:
  vision:
    provider: dgx-spark
    model: GLM-5.3-Flash-EXL3
  curator:
    provider: dgx-spark
    model: GLM-5.3-Flash-EXL3
image_gen:
  provider: openai
  openai:
    base_url: http://qwen-image.ai.svc.cluster.local:8080/v1
    # sd-server has no auth, but the provider won't run without a key.
    key_env: QWEN_IMAGE_API_KEY
    model: qwen-image-2.1-turbo
web:
  search_backend: searxng
  extract_backend: firecrawl
browser:
  cdp_url: ws://browserless.ai.svc.cluster.local:3000
tools:
  tool_search:
    enabled: "off"
dashboard:
  theme: mono
  font: jetbrains-mono
webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes-app.${LOCAL_DOMAIN}
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp
    timeout: 180
    connect_timeout: 30
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  shell_init_files:
    - /opt/terminal/profile.sh
memory:
  provider: mnemosyne
  # Both files go into every system prompt; on a 1M window behind the prompt cache this size is cheap. Both hit their
  # caps on 2026-11-07 (memory 3,659/4,000, refusing writes; user 1,290/1,375).
  memory_char_limit: 8000
  user_char_limit: 3000
  auto_migrate: true
  auto_summarize:
    threshold: 50
approvals:
  destructive_slash_confirm: false
compression:
  enabled: true
  # The default 50% of the 1M window is ~524k. The Sparks share one ~1.09M-token window across 8 streams, and a
  # cache miss at 500k is ~5 min of prefill (~1,750 tok/s), so compress well before that.
  threshold_tokens: 262144
  codex_gpt55_autoraise: false
  codex_gpt55_autoraise_notice: false
display:
  streaming: true
  tool_progress: true
  show_reasoning: true
  skin: mono
agent:
  # GLM's template only knows low and high; anything else, or no effort, thinks at Max, which loops on this quant.
  reasoning_effort: high
  # auto turns images into text descriptions whenever auxiliary.vision is set, so the main model never sees them.
  # native hands them to GLM directly; set it back to auto before /model to a text-only model.
  image_input_mode: native
streaming:
  enabled: true
security:
  redact_secrets: true
command_allowlist:
  - script execution via -e/-c flag
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
  api_server:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
  discord:
    - browser
    - clarify
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
_config_version: 46
