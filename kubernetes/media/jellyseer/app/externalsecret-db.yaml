---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seerr-db-secret
    template:
      engineVersion: v2
      data:
        DB_TYPE: postgres
        DB_HOST: postgres-rw.databases.svc.cluster.local
        DB_PORT: "5432"
        DB_NAME: seerr
        DB_USER: seerr
        DB_PASS: "{{ .SEERR_POSTGRES_PASSWORD }}"

        # Postgres init
        INIT_POSTGRES_DBNAME: seerr
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: seerr
        INIT_POSTGRES_PASS: "{{ .SEERR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: seerr
