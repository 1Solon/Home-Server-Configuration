---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: secrets
    - name: miroir-config
      namespace: flux-system
  targetNamespace: home-media
  commonMetadata:
    labels:
      app.kubernetes.io/name: recyclarr
  path: "./kubernetes/media/recyclarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false