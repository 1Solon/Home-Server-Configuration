---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reel-to-tandoor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: reel-to-tandoor-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Each Shortcut's API key maps to the Tandoor token of the account its recipes are saved to.
        REEL_USERS: |-
          {
            "{{ .REEL_MUM_API_KEY }}": {"name": "mum", "tandoor_token": "{{ .REEL_MUM_TANDOOR_TOKEN }}"},
            "{{ .REEL_SAUL_API_KEY }}": {"name": "saul", "tandoor_token": "{{ .REEL_SAUL_TANDOOR_TOKEN }}"}
          }
  dataFrom:
    - extract:
        key: reel-to-tandoor
