---
# GLM-5.3 Flash on the DGX Spark head, which runs outside the cluster, so the
# Service has no selector and its endpoint is set by hand below. In-cluster
# only: tailnet clients go through LiteLLM (kubernetes/ai/litellm), because the
# engine has no API key.
apiVersion: v1
kind: Service
metadata:
  name: dgx-spark
spec:
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: dgx-spark-1
  labels:
    kubernetes.io/service-name: dgx-spark
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http
    port: 8888
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.106
