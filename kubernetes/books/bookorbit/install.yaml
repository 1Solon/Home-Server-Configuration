---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookorbit
  namespace: flux-system
spec:
  components:
    - ../../../components/kopiur
    - ../../../components/volsync
  targetNamespace: books
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository-books
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  path: "./kubernetes/books/bookorbit/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      APP: bookorbit
      KOPIUR_SOURCE_PVC: bookorbit-kopiur-replacement
      KOPIUR_SCHEDULE: "37 */6 * * *"
      KOPIUR_SUSPEND: "false"
      VOLSYNC_REPOSITORY: s3:http://garage.garage.svc.cluster.local:3900/volsync/books/bookorbit
      VOLSYNC_SOURCE_PVC: bookorbit-kopiur-replacement
      VOLSYNC_STORAGE_CLASS: miroir-replicated
      VOLSYNC_VOLUME_SNAPSHOT_CLASS: miroir-snap
      VOLSYNC_CACHE_STORAGE_CLASS: miroir-ephemeral
      VOLSYNC_MOVER_APP_NAME: bookorbit
      VOLSYNC_MOVER_APP_INSTANCE: bookorbit
      VOLSYNC_SCHEDULE: "37 */6 * * *"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
