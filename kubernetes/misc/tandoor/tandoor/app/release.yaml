---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: &app tandoor
spec:
    interval: 30m
    chart:
        spec:
            chart: app-template
            version: 5.3.0
            sourceRef:
                kind: HelmRepository
                name: bjw-s-charts
                namespace: flux-system
    install:
        remediation:
            retries: 3
    upgrade:
        cleanupOnFail: true
        remediation:
            strategy: rollback
            retries: 3
    values:
        defaultPodOptions:
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                fsGroupChangePolicy: Always

        controllers:
            tandoor:
                annotations:
                    reloader.stakater.com/auto: "true"
                initContainers:
                    init-db:
                        image:
                            repository: ghcr.io/home-operations/postgres-init
                            tag: 19@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
                        envFrom: &envFrom
                            - secretRef:
                                  name: tandoor-secret
                containers:
                    app:
                        image:
                            repository: ghcr.io/tandoorrecipes/recipes
                            tag: 2.7.6@sha256:6c467bf484044a0305ff39bed5badb48b58bb963d4276fc248e101921151895b
                        env:
                            TZ: ${TZ}
                            # GLM-5.3 Flash on the DGX Sparks; resources/sitecustomize.py adds the reasoning_effort it needs.
                            AI_ALLOWED_URLS: http://192.168.1.106:8888/v1
                            PYTHONPATH: /config/python
                            # AI imports run inside the request, and the default 30 s kills them when the Sparks are busy.
                            GUNICORN_TIMEOUT: "120"
                            ALLOWED_HOSTS: recipes.${REMOTE_DOMAIN}
                            CSRF_TRUSTED_ORIGINS: https://recipes.${REMOTE_DOMAIN}
                            COMMENT_PREF_DEFAULT: "1"
                            DB_ENGINE: django.db.backends.postgresql
                            DEBUG: "0"
                            DEFAULT_FROM_EMAIL: recipes@${REMOTE_DOMAIN}
                            ENABLE_SIGNUP: "1"
                            FRACTION_PREF_DEFAULT: "0"
                            GUNICORN_MEDIA: "0"
                            SHOPPING_MIN_AUTOSYNC_INTERVAL: "5"
                            SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
                            SOCIALACCOUNT_EMAIL_AUTHENTICATION: "1"
                            SOCIALACCOUNT_EMAIL_AUTHENTICATION_AUTO_CONNECT: "1"
                            TANDOOR_PORT: &port 80
                        envFrom: *envFrom
                        probes:
                            liveness: &probes
                                enabled: true
                                custom: true
                                spec:
                                    httpGet:
                                        path: /
                                        port: *port
                                        httpHeaders:
                                            - name: Host
                                              value: recipes.${REMOTE_DOMAIN}
                                    initialDelaySeconds: 30
                                    periodSeconds: 10
                                    timeoutSeconds: 1
                                    failureThreshold: 3
                            readiness: *probes
                        securityContext:
                            allowPrivilegeEscalation: true
                            readOnlyRootFilesystem: false
                        resources:
                            requests:
                                cpu: 10m
                                memory: 1Gi
                            limits:
                                memory: 2Gi

        service:
            app:
                controller: *app
                ports:
                    http:
                        port: *port

        route:
            app:
                enabled: true
                annotations:
                    external-dns.alpha.kubernetes.io/target: ipv4.${REMOTE_DOMAIN}
                    gethomepage.dev/enabled: "true"
                    gethomepage.dev/name: Tandoor
                    gethomepage.dev/description: Recipe management and meal planning
                    gethomepage.dev/group: Applications
                    gethomepage.dev/icon: tandoor-recipes.png
                parentRefs:
                    - name: envoy-external
                      namespace: networking
                      sectionName: https
                hostnames:
                    - recipes.${REMOTE_DOMAIN}
                rules:
                    - backendRefs:
                          - name: *app
                            port: *port

        persistence:
            data:
                existingClaim: tandoor-kopiur-replacement
                advancedMounts:
                    tandoor:
                        app:
                            - path: /opt/recipes/mediafiles
                              subPath: mediafiles
                            - path: /opt/recipes/staticfiles
                              subPath: staticfiles
            sitecustomize:
                type: configMap
                name: tandoor-sitecustomize
                advancedMounts:
                    tandoor:
                        app:
                            - path: /config/python/sitecustomize.py
                              subPath: sitecustomize.py
                              readOnly: true
            tmpfs:
                type: emptyDir
                advancedMounts:
                    tandoor:
                        app:
                            - path: /opt/recipes/cookbook/static/django_js_reverse
                              subPath: django-js-reverse
                            - path: /var/lib/nginx/logs
                              subPath: logs
                            - path: /tmp
                              subPath: tmp
