---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: nic-watchdog-configmap
    files:
      - nic-watchdog.sh=./resources/nic-watchdog.sh
generatorOptions:
  disableNameSuffixHash: true
