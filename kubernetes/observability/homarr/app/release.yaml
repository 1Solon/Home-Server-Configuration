---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      homarr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v2.6.0@sha256:1e077fc77d3ad7482376bab964b89cfc8c1f31fe2ddeb5154cf2a1058d40b32d
            env:
              TZ: ${TZ}
              # The entrypoint starts as root, fixes ownership of /appdata and drops to PUID/PGID
              PUID: "1000"
              PGID: "1000"
              BASE_URL: https://homarr.${LOCAL_DOMAIN}
              LOG_LEVEL: info
              # SQLite at the default DB_URL (/appdata/db/db.sqlite)
              DB_DIALECT: sqlite
              DB_DRIVER: better-sqlite3
              AUTH_PROVIDERS: oidc,credentials
              AUTH_OIDC_ISSUER: https://sso.${REMOTE_DOMAIN}/application/o/homarr/
              AUTH_OIDC_CLIENT_NAME: Authentik
              # Authentik's default profile scope already carries the groups claim
              AUTH_OIDC_SCOPE_OVERWRITE: openid email profile
              AUTH_OIDC_GROUPS_ATTRIBUTE: groups
              AUTH_LOGOUT_REDIRECT_URL: https://sso.${REMOTE_DOMAIN}/application/o/homarr/end-session/
            envFrom:
              - secretRef:
                  name: homarr-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/live
                    port: &port 7575
                  # First start runs SQLite migrations; don't kill it mid-way
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Homarr
          gethomepage.dev/description: Dashboard
          gethomepage.dev/group: Applications
          gethomepage.dev/icon: homarr.png
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - homarr.${LOCAL_DOMAIN}
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      appdata:
        existingClaim: homarr
        globalMounts:
          - path: /appdata
