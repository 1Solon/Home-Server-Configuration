---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-kmsg
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  interval: 15m
  # One node at a time, and kube5 (the only amd64 node) can't pull the image
  # from its peers, so a full rollout can take longer than Helm's default 5m.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      talos-kmsg:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Talos sends the logs to 127.0.0.1, so this pod has to use the node's own network.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          priorityClassName: system-node-critical
          tolerations:
            - operator: Exists
        containers:
          app:
            image:
              repository: docker.io/timberio/vector
              tag: 0.61.0-distroless-libc@sha256:1a3451978644d5cd4b99a0b28c990791e2f7e1efbea4184122f1c59a56448143
            args: ["--config", "/etc/vector/vector.yaml"]
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        enabled: false
    persistence:
      config:
        type: configMap
        name: talos-kmsg-configmap
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true
      data:
        type: hostPath
        hostPath: /var/lib/talos-kmsg
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/vector
