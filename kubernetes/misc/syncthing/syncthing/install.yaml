---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app syncthing
  namespace: flux-system
spec:
  components:
    - ../../../../components/ext-auth
  path: "./kubernetes/misc/syncthing/syncthing/app"
  targetNamespace: syncthing
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      APP: syncthing
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
